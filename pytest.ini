[pytest]
# Guardrail: no single test should run for more than a minute. The unit suite
# shells out to bootstrap scripts, and a script that blocks on input (a read
# loop with no EOF handling, say) would otherwise hang a CI job for hours
# rather than failing fast. 120s is ample headroom over the slowest real unit
# test (<1s), even on a heavily loaded CI runner, while still catching a hang.
# The integration suite is exempt (see tests/integration/conftest.py) because
# its tests legitimately drive multi-minute converges.
timeout = 120
