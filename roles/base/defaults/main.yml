---
# These are safe fallback values for the base role.
# The active shared workstation baseline lives in inventory/group_vars/all.yml,
# and machine-local bootstrap values can override both through
# /etc/ansible/bootstrap-vars.yml.
base_workstation_base_packages: []
base_workstation_extra_packages: []
base_browser_update_packages:
  - google-chrome-stable
  - microsoft-edge-stable
  - brave-browser
  - firefox
base_browser_update_snaps:
  - firefox

base_workstation_ppas: []
base_workstation_apt_repos: []

base_workstation_extra_users: []
# Sudo group membership for bootstrap-time users is no longer managed by the
# role. The bootstrap script grants it directly (gpasswd) after the realm join,
# once each requested account can be confirmed to resolve in AD.
#
# Legacy persisted values from older hosts. These are intentionally not acted
# on during normal scheduled converges anymore.
base_sudo_users: []
base_local_sudo_users: []
# AD enrollment defaults off here so the role remains safe by default.
# Bootstrap and inventory decide when a workstation should actually enroll.
base_ad_enroll: false

base_ansible_pull_repo_url: "https://github.com/ngoh10-hhmi/ansible-pull.git"
base_ansible_pull_branch: "main"
base_ansible_pull_playbook: "playbooks/workstation.yml"
base_ansible_pull_directory: "/var/lib/ansible-pull"
base_ansible_pull_log_dir: "/var/log/ansible-pull"
# Check in every 15 minutes but keep a small spread across the fleet.
base_ansible_pull_timer_on_calendar: "*:0/15"
base_ansible_pull_randomized_delay_sec: "2m"

# Hourly apt metadata refresh is driven by a dedicated systemd timer.
base_apt_refresh_enabled: true
base_apt_refresh_timer_on_calendar: "hourly"
base_apt_refresh_randomized_delay_sec: "0"

base_managed_package_updates_enabled: true
base_managed_package_updates_timer_on_calendar: "*-*-* 03:00:00"
base_managed_package_updates_randomized_delay_sec: "15m"

# Critical services to cleanly restart-and-verify after a managed-baseline
# upgrade. dpkg may restart a long-running daemon mid-transaction against
# half-swapped plugins and leave it dead with no clean restart afterward (seen
# with sssd on Ubuntu 26.04: the AD provider .so was mismatched at the
# dpkg-triggered restart, sssd_be exited, and AD login broke until a manual
# restart hours later). For each entry, the upgrade helper does one clean
# restart plus an is-active check once the transaction settles -- but only when
# one of its trigger_packages was actually upgraded -- and fails the run if the
# service does not come back, so the failure is recorded rather than silent.
base_managed_package_updates_restart_verify:
  - service: sssd
    trigger_packages:
      - sssd
      - sssd-common
      - sssd-tools
      - sssd-ad
      - sssd-krb5
      - sssd-ldap
      - libnss-sss
      - libpam-sss

base_browser_package_updates_enabled: true
base_browser_package_updates_timer_on_calendar: "*-*-* 04:00:00"
base_browser_package_updates_randomized_delay_sec: "15m"

# Post a Slack alert when a timer-driven maintenance unit fails. These units
# (managed-package-updates, browser-package-updates, apt-refresh) run outside
# the ansible-pull wrapper, so without this their failures only land in the
# journal. The alert reuses SLACK_WEBHOOK_URL from /etc/ansible/pull.env and is
# a no-op when no webhook is configured. Set to false to remove the OnFailure
# wiring entirely (the notifier helper and template unit then go unused).
base_maintenance_failure_slack_notify_enabled: true

base_workstation_enable_unattended_upgrades: true
# Disable APT::Periodic list refresh because apt-refresh.timer owns that path.
base_workstation_update_package_lists_days: 0
base_workstation_unattended_upgrade_days: 30

base_unattended_upgrade_origins_patterns:
  - 'origin=Ubuntu,archive=${distro_codename}-security'

# Package name patterns excluded from unattended-upgrades. Each entry is
# matched as a regex against package names, so a bare prefix like "nvidia-"
# pins every nvidia-* and *nvidia-* package. NVIDIA driver packages must
# stay at the version we install — letting the security timer upgrade them
# in the background drifts the userspace libraries out of sync with the
# loaded kernel module until the next reboot.
base_unattended_upgrade_package_blacklist:
  - 'nvidia-'
  - 'libnvidia-'

# Per-UID inotify instance ceiling. The kernel default of 128 was sized for a
# far smaller desktop than these workstations: a GNOME session plus the usual
# Electron apps (Slack, browsers, editors, Dropbox) routinely holds 120+
# instances for a single logged-in user. Once a UID is at the ceiling every
# further inotify_init1() returns EMFILE, whose strerror text is the misleading
# "Too many open files" -- so the symptom surfaces in unrelated tools rather
# than in whatever leaked the instances. The common report is
# "Failed to allocate directory watch: Too many open files" during
# `sudo apt update`, emitted by the systemd-tty-ask-password-agent that
# systemctl forks from apt's ESM Pre-Invoke hook.
#
# Raising the ceiling costs nothing at rest: this is a limit, not a
# reservation, and an idle instance is a few hundred bytes of slab. The only
# memory that scales with the ceiling is queued-but-unread events, bounded per
# instance by fs.inotify.max_queued_events. Measured on Ubuntu 26.04, a single
# saturated queue holds ~0.5 MB with short filenames and ~7 MB with 255-char
# filenames, and that memory is memcg-accounted so a runaway is charged to the
# offending slice and freed when the fd closes. At 256 the worst case is
# ~128 MB to ~1.8 GB, which is why this stays modest rather than the 1024+ that
# container hosts often use: the fleet includes 16 GB and 32 GB machines.
#
# fs.inotify.max_user_watches is deliberately left alone. It is a separate
# limit (65536 by default) with a much larger per-unit cost, and real usage
# sits far below it.
base_inotify_tuning_enabled: true
base_inotify_max_user_instances: 256

# Minimum kmod version per Ubuntu release that carries the CVE-2026-31431
# ("Copy Fail") mitigation. The fix lives in kmod's modprobe blacklist for
# the affected algif_aead path, so the userspace package upgrade is what
# protects the host until a fully patched kernel ships and is rebooted into.
# Source: https://ubuntu.com/blog/copy-fail-vulnerability-fixes-available
# Releases not in this map (e.g. 'resolute', which Canonical lists as not
# affected) are skipped without error.
base_copy_fail_fixed_kmod_versions:
  jammy: '29-1ubuntu1.1'
  noble: '31+20240202-2ubuntu7.2'
  questing: '34.2-2ubuntu1.1'

# Optional one-time backfill of SLACK_WEBHOOK_URL from an AD-protected
# SMB share. Set all three to enable. The task fires only on hosts that
# (a) have completed AD enrollment, and (b) do not already have a
# SLACK_WEBHOOK_URL in /etc/ansible/pull.env, so subsequent converges
# are free no-ops. See docs/slack-webhook-setup.md.
base_slack_webhook_share_host: ""
base_slack_webhook_share_name: ""
base_slack_webhook_share_file: ""

base_security_focus_notes:
  - "Ubuntu security updates are handled through unattended-upgrades."
  - "Managed baseline packages from base_workstation_base_packages are upgraded daily."
  - "Known browser APT packages and browser snaps are upgraded daily only when already installed."
  - >-
    Firefox on modern Ubuntu is typically a snap and is refreshed through the
    browser-package timer only when the Firefox snap is already installed.
