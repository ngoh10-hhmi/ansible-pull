---
# HHMI-specific directory integration. These tasks assume this workstation
# should join hhmi.org and use SSSD plus directory-backed sudo access.
- name: Check if already joined to AD
  ansible.builtin.command: realm list
  register: base_realm_list_output
  changed_when: false

- name: Require AD enrollment settings
  ansible.builtin.assert:
    that:
      - target_hostname is defined
      - target_hostname | length > 0
      - machine_type is defined
      - machine_type in ['desktop', 'laptop']
    fail_msg: >-
      Set target_hostname and machine_type when base_ad_enroll is true.

# target_hostname and machine_type usually come from bootstrap-persisted vars,
# not from role defaults.
- name: Set hostname correctly
  ansible.builtin.hostname:
    name: "{{ target_hostname | default(ansible_facts['hostname']) }}.hhmi.org"

- name: Set DNS via resolv.conf
  ansible.builtin.file:
    src: ../run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true

# mkhomedir creates a home directory for AD users on first login.
# changed_when: false because pam-auth-update is idempotent but always exits 0
# regardless of whether it made a change.  failed_when: false because some
# minimal Ubuntu images don't have pam-auth-update; the SSSD config handles
# home dirs independently in those cases.
- name: Enable mkhomedir via pam-auth-update
  ansible.builtin.command: pam-auth-update --enable mkhomedir
  register: base_pam_auth_out
  changed_when: false
  failed_when: false

# klist -s returns exit code 0 only if the credential cache contains a valid,
# non-expired ticket.  Failing here gives a clear error before realm join
# rather than a cryptic Kerberos auth failure inside realm itself.
- name: Require an active Kerberos ticket before domain join
  ansible.builtin.command: klist -s
  changed_when: false
  when: "'hhmi.org' not in base_realm_list_output.stdout"

- name: Join AD realm using existing Kerberos credentials
  ansible.builtin.command:
    argv:
      - realm
      - join
      # --automatic-id-mapping=no tells realmd to use the UID/GID values from
      # Active Directory directly (via ldap_id_mapping = False in sssd.conf)
      # rather than generating local numeric IDs from the SID.  This keeps
      # user IDs consistent across all workstations in the domain.
      - --automatic-id-mapping=no
      - hhmi.org
  changed_when: true
  when: "'hhmi.org' not in base_realm_list_output.stdout"

- name: Configure idmapd.conf
  ansible.builtin.lineinfile:
    path: /etc/idmapd.conf
    regexp: '^#?Domain\s*='
    line: 'Domain = hhmi.org'
    insertafter: '^\[General\]'

# Ubuntu 26.04 ships SSSD running as the unprivileged `sssd` user rather than
# root. Detect that mode by checking for the package-provisioned `sssd` group:
# when it exists, the daemon needs group-read access to the machine keytab and
# its config. On older releases the group is absent and we keep the legacy
# root-only permissions.
- name: Detect non-root SSSD via sssd group presence
  ansible.builtin.command:
    argv:
      - getent
      - group
      - sssd
  register: base_sssd_group_check
  changed_when: false
  # getent returns 2 when the key is missing; only fail on real errors.
  failed_when: base_sssd_group_check.rc not in [0, 2]
  check_mode: false

- name: Record whether SSSD runs as a non-root service
  ansible.builtin.set_fact:
    base_sssd_runs_as_non_root: "{{ base_sssd_group_check.rc == 0 }}"

# realm/adcli write /etc/krb5.keytab as root:root 0600. When SSSD runs
# unprivileged it cannot read that and fails to start, so widen the group
# to `sssd` with mode 0640. Runs every converge so the perms stay correct
# even after a future keytab-rewriting operation (rejoin, machine-account
# password rotation, etc.).
- name: Allow non-root SSSD to read AD machine keytab
  ansible.builtin.file:
    path: /etc/krb5.keytab
    state: file
    owner: root
    group: sssd
    mode: "0640"
  when: base_sssd_runs_as_non_root | bool

- name: Deploy SSSD Configuration
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: "{{ 'sssd' if base_sssd_runs_as_non_root else 'root' }}"
    mode: "{{ '0640' if base_sssd_runs_as_non_root else '0600' }}"
  notify: Restart SSSD

# SSSD must be running with the new configuration before the sudo tasks run,
# because the sudo tasks call getent to resolve AD-backed usernames through
# NSS. If SSSD hasn't restarted yet those lookups will fail.
- name: Restart SSSD before applying sudo access changes
  ansible.builtin.meta: flush_handlers

# A wrong keytab/config perm on 26.04 surfaces as sssd_be exiting at startup,
# which would otherwise only be discovered when a user tries to log in. Fail
# the converge here instead.
- name: Verify SSSD is active after restart
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - sssd
  register: base_sssd_is_active
  changed_when: false
  failed_when: base_sssd_is_active.stdout | trim != 'active'
  check_mode: false

- name: Add sudoers definition for scicompsys and AD groups
  ansible.builtin.copy:
    dest: /etc/sudoers.d/10-scicompsys
    owner: root
    group: root
    mode: "0440"
    content: |
      %scicompsys ALL=(ALL:ALL) ALL
      {% if ad_sudo_group is defined %}
      %{{ ad_sudo_group }} ALL=(ALL:ALL) ALL
      {% endif %}
